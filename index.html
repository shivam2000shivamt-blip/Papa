<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SHIVAM BOT BUILDER</title><style>
:root{--bg:#05050b;--panel:#0b0b15;--panel2:#111126;--line:#26264a;--line2:#393867;--text:#f8f7ff;--muted:#9c9ab9;--a:#8b5cf6;--b:#2563eb;--good:#22c55e;--bad:#ef4444;--warn:#f59e0b;--glow:rgba(124,92,246,.25)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:radial-gradient(900px 520px at 75% -10%,rgba(91,63,180,.28),transparent 60%),radial-gradient(700px 500px at 15% 100%,rgba(37,99,235,.12),transparent 60%),var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;min-height:100vh}body:before{content:"";position:fixed;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);background-size:34px 34px;mask-image:linear-gradient(to bottom,black,transparent 85%)}
button,input,textarea,select{font:inherit}button{cursor:pointer}.app{display:flex;min-height:100vh}.side{width:270px;background:rgba(7,7,17,.86);backdrop-filter:blur(20px);border-right:1px solid rgba(90,87,145,.24);padding:20px 14px;position:sticky;top:0;height:100vh;box-shadow:18px 0 60px rgba(0,0,0,.18)}.brand{font-weight:900;font-size:19px;letter-spacing:.7px;margin:2px 10px 24px}.brand span{background:linear-gradient(90deg,#c4b5fd,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}.nav button{display:flex;align-items:center;width:100%;text-align:left;background:transparent;color:#aaa8c4;border:1px solid transparent;padding:11px 12px;border-radius:12px;margin:4px 0;transition:.18s}.nav button:hover{background:rgba(139,92,246,.08);border-color:rgba(139,92,246,.15);color:#fff;transform:translateX(2px)}.nav button.active{background:linear-gradient(100deg,rgba(139,92,246,.22),rgba(37,99,235,.12));border-color:rgba(139,92,246,.28);color:#fff;box-shadow:inset 3px 0 0 #8b5cf6,0 8px 30px rgba(78,57,150,.12)}.main{flex:1;padding:28px;max-width:1600px;margin:auto;width:100%}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;margin-bottom:22px}.title{font-size:30px;font-weight:900;letter-spacing:-.5px;background:linear-gradient(90deg,#fff,#c4b5fd 55%,#93c5fd);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--muted);margin-top:4px}.btn{border:1px solid var(--line2);background:linear-gradient(180deg,#17172b,#10101e);color:#fff;border-radius:11px;padding:10px 14px;box-shadow:0 5px 18px rgba(0,0,0,.18);transition:.18s}.btn:hover{border-color:#5a5688;transform:translateY(-1px)}.primary{background:linear-gradient(135deg,var(--a),var(--b));border:0;box-shadow:0 10px 28px rgba(99,65,190,.28)}.danger{background:rgba(127,29,29,.22);border-color:#6b2029}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px}.card{background:linear-gradient(145deg,rgba(18,18,38,.96),rgba(10,10,21,.96));border:1px solid rgba(66,64,108,.55);border-radius:17px;padding:18px;box-shadow:0 16px 45px rgba(0,0,0,.18);position:relative;overflow:hidden}.card:after{content:"";position:absolute;right:-35px;top:-35px;width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,rgba(139,92,246,.18),transparent 68%)}.metric{font-size:27px;font-weight:900;margin-top:8px}.muted{color:var(--muted)}.grid2{display:grid;grid-template-columns:1.25fr .75fr;gap:17px;margin-top:17px}.section{background:linear-gradient(145deg,rgba(14,14,29,.96),rgba(9,9,19,.96));border:1px solid rgba(66,64,108,.5);border-radius:17px;padding:19px;margin-bottom:17px;box-shadow:0 15px 45px rgba(0,0,0,.16)}.section h3{margin:0 0 14px;font-size:17px}.table{width:100%;border-collapse:collapse}.table th{color:#aaa8c4;font-size:12px;text-transform:uppercase;letter-spacing:.5px}.table th,.table td{border-bottom:1px solid rgba(47,47,76,.7);padding:12px 8px;text-align:left}.table tr:hover td{background:rgba(139,92,246,.035)}.pill{padding:5px 9px;border-radius:999px;background:#1b1b31;border:1px solid #302f53;font-size:12px}.online{color:#86efac}.offline{color:#fca5a5}.actions{display:flex;gap:8px;flex-wrap:wrap}.form{display:grid;grid-template-columns:repeat(2,1fr);gap:13px}.field label{display:block;color:#aaa8c4;font-size:12px;margin-bottom:7px}.field input,.field textarea,.field select{width:100%;background:#07070f;border:1px solid #303052;color:#fff;border-radius:11px;padding:11px;outline:none;transition:.18s}.field input:focus,.field textarea:focus,.field select:focus{border-color:#6d5cc4;box-shadow:0 0 0 3px rgba(109,92,196,.12)}.field textarea{min-height:100px;resize:vertical}.full{grid-column:1/-1}.botbar{display:flex;gap:9px;align-items:center}.select{background:#101022;color:#fff;border:1px solid var(--line2);padding:10px 12px;border-radius:11px;max-width:330px}.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(9px);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.modalbox{width:min(780px,100%);max-height:90vh;overflow:auto;background:linear-gradient(145deg,#121225,#090914);border:1px solid #45426c;border-radius:20px;padding:22px;box-shadow:0 30px 100px rgba(0,0,0,.65)}.plans{display:grid;gap:10px;margin-top:10px}.plan{border:1px solid #2c2b4b;padding:13px;border-radius:13px;background:linear-gradient(145deg,#0f0f20,#0a0a15)}.toast{position:fixed;right:18px;bottom:18px;background:#14142a;border:1px solid #4b4776;padding:12px 15px;border-radius:12px;display:none;z-index:20;box-shadow:0 15px 45px rgba(0,0,0,.45)}pre.log{white-space:pre-wrap;background:#05050b;border:1px solid #22223b;padding:14px;border-radius:12px;max-height:430px;overflow:auto}.mobile{display:none}@media(max-width:1050px){.side{width:82px;padding:12px 8px}.brand{font-size:11px;text-align:center;margin:4px 0 18px}.nav button{font-size:0;justify-content:center}.nav button:first-letter{font-size:18px}.main{padding:18px}.cards{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}.mobile{display:block}}@media(max-width:650px){.cards{grid-template-columns:1fr}.form{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.botbar{width:100%;flex-wrap:wrap}.select{max-width:100%;flex:1}.side{position:fixed;bottom:0;top:auto;width:100%;height:auto;z-index:9;display:flex;padding:7px;background:rgba(7,7,17,.94);backdrop-filter:blur(18px)}.brand{display:none}.nav{display:flex;width:100%;overflow:auto;gap:5px}.nav button{font-size:11px;white-space:nowrap;padding:9px 10px;margin:0;min-width:max-content}.nav button.active{box-shadow:inset 0 -2px 0 #8b5cf6}.main{padding:14px;padding-bottom:88px}.title{font-size:25px}.section{padding:15px}.table{display:block;overflow:auto;white-space:nowrap}}
</style></head><body><div class="app"><aside class="side"><div class="brand">SHIVAM <span>BOT</span></div><div class="nav" id="nav"></div></aside><main class="main"><div id="view"></div></main></div><div class="modal" id="modal"><div class="modalbox" id="modalbox"></div></div><div class="toast" id="toast"></div><script>
const $=s=>document.querySelector(s), api=async(u,o={})=>{const r=await fetch(u,{headers:{'Content-Type':'application/json'},...o});const j=await r.json();if(!r.ok||j.ok===false)throw Error(j.message||'Request failed');return j};let bots=[],botId=null;
const menus=[['dashboard','▦ Dashboard'],['bots','🤖 My Bots'],['products','🛍 Manage Products'],['keys','🔑 Manage Keys'],['ids','🆔 ID Stock'],['links','🔗 Product Links'],['orders','📦 Live Orders'],['api','🔌 Key Delivery API'],['upi','💳 UPI Payment'],['members','👥 Members & Wallets'],['resellers','🏪 Resellers'],['topups','💰 Top-ups'],['broadcast','📢 Bot Cast'],['settings','⚙️ Store Settings'],['profile','👤 My Profile'],['logs','📜 Logs / Health']];
function toast(x){const t=$('#toast');t.textContent=x;t.style.display='block';setTimeout(()=>t.style.display='none',2600)}
function nav(active){$('#nav').innerHTML=menus.map(([k,l])=>`<button class="${k===active?'active':''}" onclick="go('${k}')">${l}</button>`).join('')}
async function loadBots(){bots=(await api('/api/bots')).bots;if(!botId&&bots[0])botId=bots[0].id;if(botId&&!bots.find(x=>x.id===botId))botId=bots[0]?.id||null}
function botSelect(){return `<select class="select" onchange="botId=Number(this.value);go(location.hash.slice(1)||'dashboard')">${bots.map(b=>`<option value="${b.id}" ${b.id==botId?'selected':''}>${esc(b.name)} @${esc(b.username||'unknown')}</option>`).join('')}</select>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function go(page){location.hash=page;nav(page);if(page!=='bots'&&!botId){return renderEmpty('Create and deploy a bot first.')}try{if(page==='dashboard')return dashboard();if(page==='bots')return botsPage();if(page==='products')return products();if(page==='keys')return keys();if(page==='ids')return keys(true);if(page==='links')return links();if(page==='orders')return orders();if(page==='members')return members();if(page==='topups')return wallet(true);if(page==='broadcast')return broadcast();if(page==='logs')return logs();if(page==='api'||page==='upi'||page==='settings'||page==='resellers'||page==='profile')return generic(page)}catch(e){toast(e.message)}}
function head(title,sub=''){return `<div class="top"><div><div class="title">${title}</div><div class="sub">${sub}</div></div><div class="botbar">${bots.length?botSelect():''}<button class="btn primary" onclick="deploy()">+ Create Bot</button></div></div>`}
function renderEmpty(t){$('#view').innerHTML=head('SHIVAM BOT BUILDER','Working control center')+`<div class="section empty">${t}<br><br><button class="btn primary" onclick="deploy()">Create & Deploy Bot</button></div>`}
async function dashboard(){const x=await api('/api/summary/'+botId);const s=x.stats,b=x.bot;$('#view').innerHTML=head('Dashboard','Live bot control and store operations')+`<div class="cards">${[['Bot Status',b.status],['Members',s.members],['Products',s.products],['Available Keys',s.keys],['Orders',s.orders],['Delivered',s.delivered],['Revenue','₹'+s.revenue],['Top-ups','₹'+s.topups]].map(([a,v])=>`<div class="card"><div class="muted">${a}</div><div class="metric">${esc(v)}</div></div>`).join('')}</div><div class="grid2"><div class="section"><h3>Bot Runtime</h3><p>Username: <b>@${esc(b.username||'—')}</b></p><p>Status: <b class="${b.status==='online'?'online':'offline'}">${b.status}</b></p><p>Uptime start: ${esc(b.uptime_started||'—')}</p><div class="actions"><button class="btn primary" onclick="botAction('restart')">Restart</button><button class="btn" onclick="botAction('start')">Start</button><button class="btn danger" onclick="botAction('stop')">Stop</button></div></div><div class="section"><h3>Quick Actions</h3><div class="actions">${[['products','Manage Products'],['keys','Manage Keys'],['orders','Live Orders'],['members','Members & Wallets'],['topups','Top-ups'],['broadcast','Bot Cast'],['upi','UPI Payment'],['settings','Store Settings']].map(x=>`<button class="btn" onclick="go('${x[0]}')">${x[1]}</button>`).join('')}</div></div></div>`}
async function botsPage(){$('#view').innerHTML=head('My Bots','Create, deploy and control bots')+`<div class="section"><table class="table"><thead><tr><th>Bot</th><th>Owner ID</th><th>Status</th><th>Created</th><th>Actions</th></tr></thead><tbody>${bots.map(b=>`<tr><td><b>${esc(b.name)}</b><br><span class="muted">@${esc(b.username)}</span></td><td>${esc(b.owner_id)}</td><td>${b.status}</td><td>${new Date(b.created_at).toLocaleString()}</td><td><div class="actions"><button class="btn" onclick="botId=${b.id};botAction('restart')">Restart</button><button class="btn danger" onclick="botId=${b.id};botAction('stop')">Stop</button><button class="btn" onclick="botId=${b.id};go('dashboard')">Open</button></div></td></tr>`).join('')}</tbody></table>${bots.length?'':'<div class="empty">No bots deployed.</div>'}</div>`}
function deploy(){show(`<h3>Create & Deploy Bot</h3><div class="sub">Bot Token and Telegram Owner ID are sent only to the server.</div><div class="form" style="margin-top:15px"><div class="field full"><label>Bot Token</label><input id="token" type="password" autocomplete="off" placeholder="123456:AA..."></div><div class="field"><label>Telegram Owner ID</label><input id="owner" inputmode="numeric" placeholder="123456789"></div><div class="field"><label>Bot Display Name (optional)</label><input id="botname" placeholder="SHIVAM STORE"></div></div><div class="actions" style="margin-top:15px"><button class="btn" onclick="validateToken()">Verify Token</button><button class="btn primary" onclick="doDeploy()">Create & Deploy</button><button class="btn" onclick="closeModal()">Cancel</button></div><div id="verify" class="sub" style="margin-top:10px"></div>`)}
async function validateToken(){try{const j=await api('/api/bots/validate',{method:'POST',body:JSON.stringify({token:$('#token').value,ownerId:$('#owner').value})});$('#verify').textContent='✓ Telegram verified: @'+(j.bot.username||'');}catch(e){$('#verify').textContent='✕ '+e.message}}
async function doDeploy(){try{const j=await api('/api/bots/deploy',{method:'POST',body:JSON.stringify({token:$('#token').value,ownerId:$('#owner').value,name:$('#botname').value})});closeModal();await loadBots();botId=j.bot.id;toast('Bot deployed and worker started');go('dashboard')}catch(e){$('#verify').textContent='✕ '+e.message}}
async function botAction(a){try{await api(`/api/bots/${botId}/${a}`,{method:'POST',body:'{}'});toast('Bot '+a+' command sent');setTimeout(()=>go('dashboard'),500)}catch(e){toast(e.message)}}
async function products(){const j=await api('/api/products/'+botId);$('#view').innerHTML=head('Manage Products','Products and plans')+`<div class="section"><button class="btn primary" onclick="productModal()">+ Add Product</button></div><div class="cards">${j.products.map(p=>`<div class="card"><b>${esc(p.name)}</b><p class="muted">${esc(p.description||'No description')}</p><p>${p.plan_count} plans · ${p.stock} keys available</p><span class="pill">${p.maintenance?'Maintenance':p.status}</span><div class="actions" style="margin-top:12px"><button class="btn" onclick="planModal(${p.id},'${esc(p.name)}')">Plans</button><button class="btn" onclick="editProduct(${p.id})">Edit</button><button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></div></div>`).join('')||'<div class="section empty">No products.</div>'}</div>`}
function productModal(){show(`<h3>Add Product</h3><div class="form"><div class="field"><label>Product Name</label><input id="pn"></div><div class="field"><label>Channel Link</label><input id="pc"></div><div class="field full"><label>Description</label><textarea id="pd"></textarea></div><div class="field full"><label>Image URL</label><input id="pi"></div></div><h4>Plans</h4><div id="plans" class="plans"></div><button class="btn" onclick="addPlan()">+ Add More Plan</button><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveProduct()">Create Product</button><button class="btn" onclick="closeModal()">Cancel</button></div>`);addPlan()}
function addPlan(){const box=$('#plans'),i=box.children.length;const d=document.createElement('div');d.className='plan';d.innerHTML=`<b>Plan ${i+1}</b><div class="form"><div class="field"><label>Plan Name</label><input class="pname"></div><div class="field"><label>Duration</label><input class="pduration"></div><div class="field"><label>Price</label><input class="pprice" type="number" min="0"></div><div class="field"><label>Reseller Price</label><input class="preseller" type="number" min="0"></div><div class="field"><label>Remote Product ID</label><input class="prid"></div><div class="field"><label>Remote Duration</label><input class="prd"></div></div>`;box.appendChild(d)}
async function saveProduct(){const plans=[...document.querySelectorAll('.plan')].map(x=>({name:x.querySelector('.pname').value,duration:x.querySelector('.pduration').value,price:x.querySelector('.pprice').value,reseller_price:x.querySelector('.preseller').value,remote_product_id:x.querySelector('.prid').value,remote_duration:x.querySelector('.prd').value}));try{await api('/api/products/'+botId,{method:'POST',body:JSON.stringify({name:$('#pn').value,description:$('#pd').value,image_url:$('#pi').value,channel_link:$('#pc').value,plans})});closeModal();toast('Product created');products()}catch(e){toast(e.message)}}
async function deleteProduct(id){if(!confirm('Delete this product and its plans?'))return;await api('/api/products/'+id,{method:'DELETE'});products()}
async function editProduct(id){const j=await api('/api/products/'+botId),p=j.products.find(x=>x.id===id);show(`<h3>Edit Product</h3><div class="form"><div class="field"><label>Name</label><input id="en" value="${esc(p.name)}"></div><div class="field"><label>Channel Link</label><input id="ec" value="${esc(p.channel_link)}"></div><div class="field full"><label>Description</label><textarea id="ed">${esc(p.description)}</textarea></div><div class="field"><label>Status</label><select id="es"><option value="active" ${p.status==='active'?'selected':''}>Active</option><option value="disabled" ${p.status==='disabled'?'selected':''}>Disabled</option></select></div><div class="field"><label>Maintenance</label><select id="em"><option value="0">Off</option><option value="1" ${p.maintenance?'selected':''}>On</option></select></div></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveEdit(${id})">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
async function saveEdit(id){await api('/api/products/'+id,{method:'PUT',body:JSON.stringify({name:$('#en').value,channel_link:$('#ec').value,description:$('#ed').value,status:$('#es').value,maintenance:$('#em').value})});closeModal();products()}
async function planModal(pid,name){const j=await api('/api/plans/'+pid+'?bot_id='+botId);show(`<h3>${esc(name)} — Plans</h3>${j.plans.map(p=>`<div class="plan"><b>${esc(p.name)}</b><br>${esc(p.days)} days · ₹${p.customer_price} · Reseller ₹${p.reseller_price}</div>`).join('')||'<div class="empty">No plans.</div>'}<div class="actions" style="margin-top:15px"><button class="btn primary" onclick="addPlanDirect(${pid})">+ Add Plan</button><button class="btn" onclick="closeModal()">Close</button></div>`)}
async function addPlanDirect(pid){show(`<h3>Add Plan</h3><div class="form"><div class="field"><label>Name</label><input id="apn"></div><div class="field"><label>Duration</label><input id="apd"></div><div class="field"><label>Price</label><input id="app" type="number"></div><div class="field"><label>Reseller Price</label><input id="apr" type="number"></div><div class="field"><label>Remote Product ID</label><input id="apid"></div><div class="field"><label>Remote Duration</label><input id="ard"></div></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="savePlan(${pid})">Save</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
async function savePlan(pid){await api('/api/plans/'+pid,{method:'POST',body:JSON.stringify({bot_id:botId,name:$('#apn').value,duration:$('#apd').value,days:parseInt($('#apd').value)||0,price:$('#app').value,reseller_price:$('#apr').value,remote_product_id:$('#apid').value,remote_duration:$('#ard').value})});closeModal();products()}
async function keys(ids=false){const j=await api('/api/keys/'+botId);$('#view').innerHTML=head(ids?'ID Stock':'Manage Keys','Manual stock and delivery inventory')+`<div class="section"><button class="btn primary" onclick="keyModal()">+ Bulk Add ${ids?'IDs':'Keys'}</button></div><div class="section"><table class="table"><thead><tr><th>Value</th><th>Product</th><th>Plan</th><th>Status</th><th>Created</th></tr></thead><tbody>${j.keys.map(k=>`<tr><td>${esc(k.key_value)}</td><td>${esc(k.product||'—')}</td><td>${esc(k.plan||'—')}</td><td>${k.status}</td><td>${new Date(k.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
async function keyModal(){const j=await api('/api/products/'+botId);const opts=j.products.flatMap(p=>[]);const all=[];for(const p of j.products){const z=await api('/api/plans/'+p.id+'?bot_id='+botId);z.plans.forEach(pl=>all.push({id:pl.id,name:p.name+' — '+pl.name}))}show(`<h3>Bulk Add Keys / IDs</h3><div class="form"><div class="field full"><label>Plan</label><select id="kplan">${all.map(x=>`<option value="${x.id}">${esc(x.name)}</option>`).join('')}</select></div><div class="field full"><label>One item per line</label><textarea id="kv" placeholder="KEY-001\nKEY-002\nKEY-003"></textarea></div></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveKeys()">Add Stock</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
async function saveKeys(){const j=await api('/api/keys/'+botId+'/bulk',{method:'POST',body:JSON.stringify({keys:$('#kv').value,plan_id:$('#kplan').value})});closeModal();toast(j.added+' added');keys()}
async function links(){const j=await api('/api/products/'+botId);$('#view').innerHTML=head('Product Links','Direct buy links')+`<div class="section"><table class="table"><thead><tr><th>Product</th><th>Status</th><th>Link</th></tr></thead><tbody>${j.products.map(p=>`<tr><td>${esc(p.name)}</td><td>${p.status}</td><td><code>/buy/${p.id}</code></td></tr>`).join('')}</tbody></table></div>`}
async function orders(){const j=await api('/api/orders/'+botId);$('#view').innerHTML=head('Live Key Delivery & Orders','Order and delivery records')+`<div class="section"><table class="table"><thead><tr><th>Order</th><th>User</th><th>Product</th><th>Plan</th><th>Amount</th><th>Payment</th><th>Delivery</th><th>Time</th></tr></thead><tbody>${j.orders.map(o=>`<tr><td>#${o.id}</td><td>${esc(o.user_id)}<br>${esc(o.username)}</td><td>${esc(o.product||'—')}</td><td>${esc(o.plan||'—')}</td><td>₹${o.amount}</td><td>${o.status}</td><td>${o.delivery}</td><td>${new Date(o.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
async function members(){const j=await api('/api/users/'+botId);$('#view').innerHTML=head('Members & Wallets','Users and wallet balances')+`<div class="section"><table class="table"><thead><tr><th>Telegram ID</th><th>Username</th><th>Role</th><th>Balance</th><th>Joined</th></tr></thead><tbody>${j.users.map(u=>`<tr><td>${esc(u.telegram_id)}</td><td>${esc(u.username)}</td><td>${u.role}</td><td>₹${u.balance}</td><td>${new Date(u.joined_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
async function wallet(){const j=await api('/api/users/'+botId);$('#view').innerHTML=head('Top-ups','Wallet adjustment / top-up records')+`<div class="section"><button class="btn primary" onclick="topupModal()">+ Add Top-up</button></div><div class="section"><table class="table"><thead><tr><th>User</th><th>Balance</th><th>Role</th></tr></thead><tbody>${j.users.map(u=>`<tr><td>${u.telegram_id}</td><td>₹${u.balance}</td><td>${u.role}</td></tr>`).join('')}</tbody></table></div>`}
function topupModal(){show(`<h3>Add Wallet Top-up / Adjustment</h3><div class="form"><div class="field"><label>Telegram ID</label><input id="tu"></div><div class="field"><label>Amount (₹)</label><input id="ta" type="number"></div><div class="field full"><label>Reason</label><input id="tr"></div></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveTopup()">Apply</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
async function saveTopup(){await api('/api/wallet/'+botId,{method:'POST',body:JSON.stringify({telegram_id:$('#tu').value,amount:$('#ta').value,reason:$('#tr').value})});closeModal();toast('Wallet updated');wallet()}
async function broadcast(){const j=await api('/api/broadcasts/'+botId);$('#view').innerHTML=head('Bot Cast / Broadcast','Queue broadcast campaigns')+`<div class="section"><button class="btn primary" onclick="broadcastModal()">+ New Broadcast</button></div><div class="section"><table class="table"><thead><tr><th>ID</th><th>Message</th><th>Status</th><th>Sent</th><th>Failed</th><th>Created</th></tr></thead><tbody>${j.broadcasts.map(b=>`<tr><td>#${b.id}</td><td>${esc(b.text).slice(0,100)}</td><td>${b.status}</td><td>${b.sent}</td><td>${b.failed}</td><td>${new Date(b.created_at).toLocaleString()}</td></tr>`).join('')}</tbody></table></div>`}
function broadcastModal(){show(`<h3>Bot Cast</h3><div class="field"><label>Message</label><textarea id="bt"></textarea></div><div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveBroadcast()">Queue Broadcast</button><button class="btn" onclick="closeModal()">Cancel</button></div>`)}
async function saveBroadcast(){await api('/api/broadcast/'+botId,{method:'POST',body:JSON.stringify({text:$('#bt').value})});closeModal();toast('Broadcast queued');broadcast()}
async function logs(){const j=await api('/api/logs/'+botId);const h=await api('/api/health');$('#view').innerHTML=head('Logs / Health','Runtime diagnostics')+`<div class="cards"><div class="card"><div class="muted">Builder</div><div class="metric">${h.status}</div></div><div class="card"><div class="muted">Running Workers</div><div class="metric">${h.bots}</div></div></div><div class="section"><h3>Bot Log</h3><pre class="log">${esc(j.logs||'No log yet.')}</pre></div>`}
async function generic(page){const meta={api:['Key Delivery API Setup',['key_delivery_api_url','key_delivery_api_key']],upi:['UPI Payment Setup',['upi_id','upi_qr_note','upi_payment_enabled']],settings:['Store Settings',['store_name','store_tagline','support_url','tutorial_url','selling_proof_url','paid_store_url','low_stock_threshold','maintenance_mode']],resellers:['Resellers',[]],profile:['My Profile',[]]}[page];if(page==='resellers'){const j=await api('/api/resellers/'+botId);$('#view').innerHTML=head('Resellers','Users marked as reseller')+`<div class="section"><div class="field"><label>Internal User ID to promote</label><input id="rid" inputmode="numeric"></div><div class="actions" style="margin-top:12px"><button class="btn primary" onclick="promoteReseller()">Promote</button></div></div><div class="section"><table class="table"><tr><th>User</th><th>Balance</th><th>Joined</th></tr>${j.resellers.map(x=>`<tr><td>${esc(x.id)} · ${esc(x.username||x.first_name)}</td><td>₹${x.balance}</td><td>${new Date(x.created_at).toLocaleString()}</td></tr>`).join('')}</table></div>`;return}if(page==='profile'){const b=bots.find(x=>x.id==botId);$('#view').innerHTML=head('My Profile','Builder owner and bot profile')+`<div class="section"><p><b>Bot:</b> @${esc(b?.username)}</p><p><b>Owner Telegram ID:</b> ${esc(b?.owner_id)}</p><p><b>Bot ID:</b> ${botId}</p><p class="muted">Token is encrypted at rest and never displayed.</p></div>`;return}const cfg=(await api('/api/config/'+botId)).settings.reduce((a,x)=>(a[x.key]=x.value,a),{});$('#view').innerHTML=head(meta[0],'Persistent configuration used by the deployed bot')+`<div class="section"><div class="form">${meta[1].map(k=>`<div class="field"><label>${k}</label><input id="cfg_${k}" value="${esc(cfg[k]||'')}"></div>`).join('')||'<div class="empty">No extra reseller configuration required.</div>'}</div>${meta[1].length?`<div class="actions" style="margin-top:15px"><button class="btn primary" onclick="saveConfig(${JSON.stringify(meta[1])})">Save</button></div>`:''}</div>`}
async function saveConfig(keys){const body={};keys.forEach(k=>body[k]=$('#cfg_'+k).value);await api('/api/config/'+botId,{method:'PUT',body:JSON.stringify(body)});toast('Configuration saved to bot database.');}
async function promoteReseller(){await api('/api/resellers/'+botId,{method:'POST',body:JSON.stringify({user_id:Number($('#rid').value)})});toast('Reseller updated');generic('resellers')}
function show(html){$('#modalbox').innerHTML=html;$('#modal').classList.add('show')}function closeModal(){$('#modal').classList.remove('show')}$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});
(async()=>{try{await loadBots();go(location.hash.slice(1)||'dashboard')}catch(e){toast(e.message)}})();
</script></body></html>
