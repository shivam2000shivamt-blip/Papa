services:
  - type: web
    name: shivam-bot-builder
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: BUILDER_SECRET
        sync: false
      - key: DATA_DIR
        value: /var/data
    disk:
      name: shivam-data
      mountPath: /var/data
      sizeGB: 1
